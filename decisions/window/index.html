<!doctype html>
<!--
  decisions/window/index.html - the page of the decisions window: the list of questions, and the fleet
  panel at its side. This file and shell.js are the only place the two meet: the list
  (decisions/page/) and the panel (fleet/panel/) each know nothing of the other, and each is loaded
  from its own mount (surfaces/Port.ps1, WHERE A PAGE FINDS A MOUNT).

  NOTHING FROM OUTSIDE. Every script and style is one of Horde's own files; the policy below lets the
  page load from the four mounts and from nowhere else, connect to nothing, and submit nothing.
  There is no inline script.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://window.horde.invalid https://list.horde.invalid https://fleet.horde.invalid https://surface.horde.invalid; style-src https://window.horde.invalid https://list.horde.invalid https://fleet.horde.invalid; img-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open decisions</title>
<link rel="stylesheet" href="https://window.horde.invalid/shell.css">
<link rel="stylesheet" href="https://list.horde.invalid/list.css">
<link rel="stylesheet" href="https://fleet.horde.invalid/panel.css">
</head>
<body>
<header class="top">
  <div class="hdr">
    <h1>Open decisions</h1>
    <span class="counts" id="counts"></span>
    <span class="tg" id="filters" role="group" aria-label="Which questions to show"></span>
    <span class="only" id="only" hidden></span>
  </div>
  <div class="notice" id="notice" hidden></div>
</header>
<div class="mid">
  <main id="main"><div class="dcols" aria-hidden="true"><span></span><span class="num">No.</span><span>Question</span><span>Waiting</span><span>Recommended</span></div><div id="list"></div></main>
  <aside id="fleet" aria-label="Fleet: the open Orcs"></aside>
</div>
<footer class="foot" id="foot" title="Read-only for now: answering from this window is the next step. Until then, answer by number in chat. A number belongs to one question for ever.">Read-only: answering here comes next. Until then, answer by number in chat.</footer>
<script src="https://surface.horde.invalid/bridge.js"></script>
<script src="https://list.horde.invalid/list.js"></script>
<script src="https://fleet.horde.invalid/panel.js"></script>
<script src="https://window.horde.invalid/shell.js"></script>
</body>
</html>
